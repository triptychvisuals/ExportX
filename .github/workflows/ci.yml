name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node scripts/check-syntax.js
      - name: Unit tests (mock Resolve)
        run: node --test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python self-test
        run: |
          python -m py_compile python/exportx_batch.py
          python python/exportx_batch.py --selftest
      - name: Validate manifest
        run: python -c "import xml.dom.minidom as m; m.parse('manifest.xml'); print('manifest ok')"
